# 広報版のシーンの記述（架空の部屋。実在の会場の寸法・名前は使っていない）。
# 形（キー・単位）は fk_sim/scene モジュールの docstring に書いてある。
# 座標は Gazebo のワールド座標で単位は m・rad。部屋は x in [0, 12], y in [0, 8]。
visibility: public
name: public_room
room:
  size_x: 12.0
  size_y: 8.0
  ceiling_h: 4.0
  wall_h: 4.0
  wall_t: 0.15
  floor_color: [0.55, 0.55, 0.55]
  wall_color: [0.8, 0.8, 0.78]
panels:
  # 連盤 1 列（3 面）。北の壁際に並べ、正面は部屋の中（南）へ向ける。
  - id: P001
    center: [5.1, 7.52]
    front_yaw: -1.5708
    width: 0.8
    depth: 0.8
    height: 2.35
    label: "No.1"
    lugs: four
  - id: P002
    center: [5.9, 7.52]
    front_yaw: -1.5708
    width: 0.8
    depth: 0.8
    height: 2.35
    label: "動力盤"
    lugs: four
  - id: P003
    center: [6.8, 7.52]
    front_yaw: -1.5708
    width: 1.0
    depth: 0.8
    height: 2.35
    label: "No.2"
    lugs: four
  # 単盤 1 面。部屋の中ほどで、正面は西（-X）へ向ける。
  - id: P004
    center: [3.0, 3.0]
    front_yaw: 3.1416
    width: 1.2
    depth: 1.0
    height: 2.35
    label: "No.3"
    lugs: four
obstacles:
  # 低い台車ほどの箱
  - center: [8.5, 2.0]
    size: [0.9, 0.6, 0.5]
    yaw: 0.0
    label: "cart"
  # 背の高い棚
  - center: [10.5, 4.0]
    size: [1.6, 0.5, 2.2]
    yaw: 0.0
    label: "shelf"
robot:
  pose: [6.0, 2.5, 1.5708]
lights:
  - type: point
    position: [6.0, 4.0, 3.9]
    energy: 1.0
  - type: point
    position: [3.0, 4.0, 3.9]
    energy: 1.0
  - type: ambient
    energy: 0.6
